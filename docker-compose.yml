services:
  mysql-otf:
    container_name: mysql-otf
    image: mysql:8.0
    volumes:
      - db:/var/lib/mysql
      - type: bind
        source: ./docker/mysql/tmp
        target: /tmp/mysql/
      - ./docker/mysql/conf:/etc/mysql/conf.d
    environment:
      - TZ=Europe/Paris
      - MYSQL_DATABASE=dev_ouvretaferme
      - MYSQL_ALLOW_EMPTY_PASSWORD=true
      - MYSQL_AUTHENTICATION_PLUGIN=mysql_native_password
      - ALLOW_EMPTY_PASSWORD=yes
    restart: always
    ports:
      - '3316:3306'
    networks:
      - app-tier
  redis-otf:
    container_name: redis-otf
    image: redis:latest
    restart: always
    entrypoint: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    networks:
      - app-tier
    ports:
      - '6389:6379'
    volumes:
      - redisData:/data
    environment:
      - TZ=Europe/Paris
  php-fpm-otf:
    container_name: php-fpm-otf
    user: 'root:users'
    ports:
      - '90:80'
    volumes:
      - type: bind
        source: ./src
        target: /var/www/otf/
      - type: bind
        source: ./docker/php-fpm/otf-storage
        target: /var/www/storage/
      - sock:/tmp
      - ./docker/php-fpm/www.conf:/usr/local/etc/php-fpm.d/zz-docker.conf:ro
      - ./docker/php-fpm/php.ini:/usr/local/etc/php/conf.d/php.ini:ro
      - type: bind
        source: ./docker/php-fpm/tmp
        target: /tmp/shared
    networks:
      - app-tier
    build:
      context: .
      dockerfile: ./docker/php-fpm/Dockerfile
    environment:
      - TZ=Europe/Paris
    # Nécessaire pour puppeteer (accès à la dev depuis docker)
    extra_hosts:
      - "www.dev-ouvretaferme.org:host-gateway"
      - "www.dev-ouvretaferme.localhost:host-gateway"
  phpmyadmin:
    container_name: pma-otf
    image: phpmyadmin
    restart: always
    depends_on:
      - mysql-otf
    ports:
      - '100:80'
    environment:
      PMA_HOST: mysql-otf
    networks:
      - app-tier
    extra_hosts:
      - "pma.dev-ouvretaferme.org:host-gateway" # accès depuis pma.dev-ouvretaferme.org:100
  web-otf:
    container_name: web-otf
    image: nginx:latest
    ports:
      - '80'
    volumes:
      - sock:/tmp
      - type: bind
        source: ./src
        target: /var/www/otf/
      - type: bind
        source: ./docker/php-fpm/otf-storage
        target: /var/www/storage/
      - ./src/ouvretaferme/main/conf/rewrite/dev.cfg:/etc/nginx/conf.d/nginx-otf.conf
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php-fpm-otf
    links:
      - php-fpm-otf
    networks:
      - app-tier
      - traefik_default
    environment:
      - TZ=Europe/Paris
    labels:
      - 'traefik.enable=true'
      - 'traefik.docker.network=traefik_default'
      - 'traefik.http.routers.otf.rule=HostRegexp(`^.+\.dev-ouvretaferme.org`) || HostRegexp(`^.+\.dev-ouvretaferme.localhost`)'
      - 'traefik.http.routers.otf.entrypoints=web'
      - 'traefik.http.routers.otf-secure.rule=HostRegexp(`^.+\.dev-ouvretaferme.org`) || HostRegexp(`^.+\.dev-ouvretaferme.localhost`)'
      - 'traefik.http.routers.otf-secure.entrypoints=websecure'
      - 'traefik.http.routers.otf-secure.tls=true'
      - 'traefik.http.middlewares.limit.buffering.maxRequestBodyBytes=20000000'
  metabase:
    container_name: metabase-otf
    image: metabase/metabase:latest
    restart: always
    environment:
      MB_DB_TYPE: 'mysql'
      MB_DB_DBNAME: 'metabase'
      MB_DB_PORT: '3306'
      MB_DB_USER: 'root'
      MB_DB_PASS: ''
      MB_DB_HOST: 'mysql-otf'
    depends_on:
      - mysql-otf
    ports:
      - '3000:3000'
    networks:
      - app-tier
    volumes:
      # Volumes where Metabase data will be persisted
      - ./docker/metabase:/metabase-data
  flutter-otf:
    container_name: flutter-otf
    build:
      context: .
      dockerfile: docker/flutter/Dockerfile
    volumes:
      - ./mobile:/app
    working_dir: /app
    ports:
      # Serveur web Flutter de dev : flutter run -d web-server --web-port 8080
      - '8088:8080'
    environment:
      - TZ=Europe/Paris
    networks:
      - app-tier
    # TTY + stdin ouverts : permet `docker attach flutter-otf` pour piloter flutter run
    # (r = hot reload, R = hot restart, q = quitter). Détacher avec Ctrl-P puis Ctrl-Q.
    stdin_open: true
    tty: true
    # Sert l'app sur :8080 (mappé sur l'hôte :8088). pub get au boot pour robustesse.
    command: sh -c "flutter pub get && flutter run -d web-server --web-port 8080 --web-hostname 0.0.0.0"
volumes:
  static:
  db:
  redisData:
  sock:
networks:
  app-tier:
  traefik_default:
    external: true
