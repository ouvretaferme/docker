# Au niveau http et non dans un server : ce bloc-ci n'a pas de server_name, il ne traite donc que
# ce qui ne correspond à aucun vhost. Les requêtes applicatives vont dans nginx-otf.conf, qui n'a
# pas la directive — nginx y appliquait son défaut de 1 Mo et rendait un 413 brut, avant PHP.
client_max_body_size 20m;

# framework/dev/conf/rewrite/lime.cfg applique limit_req zone=app, mais cette zone n'est déclarée
# que dans prod.cfg, qui n'est pas monté en dev : sans elle nginx refuse toute relecture de sa
# configuration (« zero size shared memory zone »). Débit large, il ne s'agit pas de limiter ici.
limit_req_zone $binary_remote_addr zone=app:10m rate=1000r/s;

server {
    listen 80;
    root /var/www/otf;
    location / {
        index index.php index.html;
    }
    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass php-fpm-otf:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root/$fastcgi_script_name;
    }
}
